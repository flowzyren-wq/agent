name: Build NgotakStreamQx Release APK

# Build release APK untuk repo eksternal flowzyren-wq/NgotakStreamQx
# (repo itu tidak bisa di-push dari sini, jadi fix dikirim sebagai patch).
# Hasil APK di-push ke branch ngotak-apk-v1.0.7 di repo ini.

on:
  push:
    branches:
      - arena/01a0dd37-agent
    paths:
      - 'ngotak-build/**'
      - '.github/workflows/build-ngotak-release.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repo agent (berisi patch)
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Clone NgotakStreamQx
        run: |
          set -x
          git clone --depth 1 https://github.com/flowzyren-wq/NgotakStreamQx.git app
          ls -la app | head -5

      - name: Apply fix patch
        run: |
          set -x
          cd app
          git apply --check -v ../ngotak-build/fix-v1.0.7.patch
          git apply ../ngotak-build/fix-v1.0.7.patch
          git status --short

      - name: Commit patched source
        run: |
          set -x
          cd app
          git config user.name arena-agent
          git config user.email agent@arena.ai
          git add -A
          git commit -m "fix: player orientation lifecycle + sw-dp breakpoint (patch v1.0.4)"
          git log --oneline -2

      - name: npm ci
        working-directory: app
        run: npm ci --no-audit --no-fund

      - name: Build sandbox runtime
        working-directory: app
        run: npm run build:sandbox

      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -storetype PKCS12 \
            -keystore "$GITHUB_WORKSPACE/app/ngotakstreamqx-release.keystore" \
            -storepass ngotakstreamqx \
            -alias ngotakstreamqx \
            -keypass ngotakstreamqx \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=NgotakStream Qx, OU=Build, O=QxShaa, L=Bandung, ST=West Java, C=ID"

      - name: Build release APK
        working-directory: app/android
        env:
          MYAPP_UPLOAD_STORE_FILE: ${{ github.workspace }}/app/ngotakstreamqx-release.keystore
          MYAPP_UPLOAD_STORE_PASSWORD: ngotakstreamqx
          MYAPP_UPLOAD_KEY_ALIAS: ngotakstreamqx
          MYAPP_UPLOAD_KEY_PASSWORD: ngotakstreamqx
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p apk
          ls -la app/android/app/build/outputs/apk/release/ || true
          for f in app/android/app/build/outputs/apk/release/*.apk; do
            sz=$(stat -c%s "$f")
            echo "$f : $sz bytes"
            # skip file > 90MB (batas aman push git)
            if [ "$sz" -lt 94371840 ]; then
              cp "$f" apk/
            else
              echo "SKIP (terlalu besar): $f"
            fi
          done
          ls -la apk/

      - name: Push APK ke branch
        run: |
          cd apk
          git init -b ngotak-apk-v1.0.7
          git config user.name arena-agent
          git config user.email agent@arena.ai
          git add *.apk
          git commit -m "Release APK v1.0.4 — fix orientation player + layout mobile"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin ngotak-apk-v1.0.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact (cadangan)
        uses: actions/upload-artifact@v4
        with:
          name: ngotakstreamqx-release-apk
          path: apk/*.apk
          retention-days: 7
